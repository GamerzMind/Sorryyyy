  <script>
    // Audio player controller logic
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    let isPlaying = false;

    musicToggle.addEventListener('click', () => {
      if (!isPlaying) {
        bgMusic.play().then(() => {
          isPlaying = true;
          musicToggle.textContent = 'Pause ⏸️';
        }).catch(err => {
          console.log("Audio playback error:", err);
          alert("Click anywhere on the screen first, then hit Play!");
        });
      } else {
        bgMusic.pause();
        isPlaying = false;
        musicToggle.textContent = 'Play 🎵';
      }
    });
  </script>
